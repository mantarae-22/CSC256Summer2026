<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkers</title>

    <link rel="stylesheet" href="checkers.css">

    <script src="checkers.js" defer></script>
</head>
<body>
    <header>
        <h1>Checkers</h1>
